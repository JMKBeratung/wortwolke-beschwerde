<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wortwolke Monitor</title>
<style>
:root{--g:#005750;--s:#F0EAD6;--p:#F4B183;--t:#00C0B1;--r:#E94F35}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--g);color:var(--s);font-family:"Source Sans Pro","Segoe UI",Arial,sans-serif;overflow:hidden}
header{position:fixed;left:0;right:0;top:0;padding:22px 40px;display:flex;justify-content:space-between;align-items:baseline;z-index:2}
h1{margin:0;font-size:34px;font-weight:700}
#info{font-size:18px;color:var(--p)}
#cloud{position:fixed;left:0;right:290px;top:90px;bottom:0}
#qr{position:fixed;right:24px;top:110px;width:250px;background:#00443E;border-radius:14px;padding:16px;text-align:center;z-index:2}
#qr img{width:218px;height:218px;background:#fff;padding:8px;border-radius:8px;display:block;margin:10px auto}
#qr b{color:var(--p);font-size:22px}#qr small{display:block;font-size:15px;margin-top:4px}
.w{position:absolute;white-space:nowrap;line-height:1;font-weight:700;transition:opacity .6s,transform .6s;transform-origin:center}
.w.new{opacity:0;transform:scale(.4)}
#empty[hidden]{display:none}#empty{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--p);opacity:.8}
</style></head><body>

<script>
const GARDEN="5255018", EVERY=3000;           // Aktualisierung alle 3 Sekunden
const COLORS=["#F0EAD6","#F4B183","#00C0B1","#E94F35","#FFFFFF"];
const demo=location.search.includes("demo");
let last="", shown=new Set();
const cloud=document.getElementById("cloud"), info=document.getElementById("info"), empty=document.getElementById("empty");
const ctx=document.createElement("canvas").getContext("2d");
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}
function layout(words){
  const W=cloud.clientWidth,H=cloud.clientHeight,cx=W/2,cy=H/2,max=Math.max(...words.map(w=>w.weight)),min=Math.min(...words.map(w=>w.weight));
  const maxS=Math.min(H*0.16,100),minS=28,placed=[],out=[];
  words.sort((a,b)=>b.weight-a.weight||a.text.localeCompare(b.text));
  for(const w of words){
    const k=max===min?0.6:(w.weight-min)/(max-min);
    let size=minS+(maxS-minS)*Math.sqrt(k)*(max>1?1:0.6);
    for(let tries=0;tries<12;tries++){
      ctx.font="700 "+size+'px "Source Sans Pro","Segoe UI",Arial';
      const tw=ctx.measureText(w.text).width+16,th=size*1.05;
      let ok=false,x=0,y=0;
      for(let a=0;a<2400;a+=1){
        const ang=a*0.35,rad=2.2*a*0.12;
        x=cx+Math.cos(ang)*rad*1.6-tw/2; y=cy+Math.sin(ang)*rad-th/2;
        if(x<8||y<4||x+tw>W-8||y+th>H-4)continue;
        if(!placed.some(p=>x<p.x+p.w&&x+tw>p.x&&y<p.y+p.h&&y+th>p.y)){ok=true;break}
      }
      if(ok){placed.push({x,y,w:tw,h:th});out.push({...w,size,x:x+8,y});break}
      size*=0.88;
    }
  }
  return out;
}
function render(list){
  empty.hidden=list.length>0;
  const total=list.reduce((a,w)=>a+w.weight,0);
  info.textContent=total+" Antworten, "+list.length+" verschiedene Wörter · aktualisiert "+new Date().toLocaleTimeString("de-DE");
  const key=JSON.stringify(list.map(w=>[w.text,w.weight]));
  if(key===last)return; last=key;
  const pos=layout(list.map(w=>({text:w.text,weight:w.weight})));
  cloud.innerHTML="";
  for(const w of pos){
    const d=document.createElement("div");d.className="w"+(shown.has(w.text)?"":" new");d.textContent=w.text;
    d.style.cssText+=`left:${w.x}px;top:${w.y}px;font-size:${w.size}px;color:${COLORS[hash(w.text)%COLORS.length]}`;
    cloud.appendChild(d);requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.remove("new")));shown.add(w.text);
  }
}
function demoData(){return [["Ärger",9],["Scham",7],["Ungerechtigkeit",6],["Kränkung",5],["Angst",4],["Frust",4],["Hilflosigkeit",3],["Dankbarkeit",3],["Überforderung",2],["Respekt",2],["Chance",2],["Ohnmacht",1],["Lernen",1],["Erleichterung",1],["Druck",1]].map(([text,weight])=>({text,weight}))}
function poll(){
  if(demo){render(demoData());return}
  const s=document.createElement("script");
  s.src="https://answergarden.ch/api/array/"+GARDEN+"?t="+Date.now();
  s.onload=()=>{try{render((window.word_list||[]).map(w=>({text:String(w.text),weight:Number(w.weight)||1})))}catch(e){info.textContent="Fehler bei der Anzeige"}s.remove()};
  s.onerror=()=>{info.textContent="keine Verbindung, nächster Versuch in 3 s";s.remove()};
  document.head.appendChild(s);
}
poll(); setInterval(poll,EVERY);
addEventListener("resize",()=>{last="";poll()});
addEventListener("keydown",e=>{if(e.key==="f"||e.key==="F"){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}});
</script></body></html>
